<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>早读分贝测试器</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(165deg,#5b3a8e 0%,#6a4a9e 35%,#7b5aae 60%,#8a6cc0 100%);
    color:#fff; height:100vh; width:100vw;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; user-select:none; -webkit-user-select:none;
  }
  .bubble{position:absolute; border-radius:50%; background:rgba(255,255,255,.07);
          animation:float 14s ease-in-out infinite; pointer-events:none}
  @keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-26px) translateX(12px)}}

  #timerChip{position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.18); backdrop-filter:blur(4px);
    padding:6px 16px; border-radius:999px; font-size:.95rem; font-weight:700;
    display:none; align-items:center; gap:6px; letter-spacing:1px}
  #timerChip.show{display:inline-flex}

  #gearBtn{position:absolute; top:12px; right:12px; width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.15); border:none; color:#fff; font-size:1.25rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px)}
  #gearBtn:active{transform:scale(.94)}

  .stage{position:relative; z-index:2; flex:1; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center}

  .dbnum{font-size:min(38vw,11rem); font-weight:800; color:#f6a623; line-height:1;
    text-shadow:0 6px 24px rgba(0,0,0,.25); display:flex; align-items:baseline; justify-content:center}
  .dbdec{font-size:.32em; font-weight:800; color:#f6a623; opacity:.85; display:inline-block;
    animation:bounce .9s ease-in-out infinite}
  .dbdec span{display:inline-block; animation:bounce 1.05s ease-in-out infinite}
  .dbdec span:nth-child(2){animation-duration:1.2s; animation-delay:.08s}
  .dbdec span:nth-child(3){animation-duration:.95s; animation-delay:.16s}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-.35em)}}
  .dblabel{font-size:1.15rem; letter-spacing:6px; margin:6px 0 22px; opacity:.95; text-indent:6px}

  /* 实时诊断状态条 */
  #status{font-size:.72rem; opacity:.85; margin:-8px 0 14px; min-height:1.1em; letter-spacing:.3px;
    text-align:center; max-width:92vw; line-height:1.4}
  #status.ok{color:#bff7c5}
  #status.warn{color:#ffe08a}

  .barwrap{width:min(86vw,560px); position:relative}
  .bar{height:16px; border-radius:999px; overflow:visible; position:relative;
    background:linear-gradient(90deg,#43c94e 0%,#a8d84a 22%,#f7d51d 38%,#f6a623 55%,#c96a1e 74%,#6e3b12 100%);
    box-shadow:0 3px 10px rgba(0,0,0,.25)}
  #cursor{position:absolute; top:-7px; bottom:-7px; width:5px; background:#fff; border-radius:3px;
    box-shadow:0 0 8px rgba(0,0,0,.5); left:0; transform:translateX(-50%); transition:left .1s linear}
  .ticks{display:flex; justify-content:space-between; margin-top:8px; font-size:.85rem; opacity:.9}
  .ticks span{transform:translateX(-50%)}
  .ticks span:first-child{transform:none}
  .ticks span:last-child{transform:translateX(-100%)}

  #badge{margin-top:30px; padding:12px 26px; border-radius:12px; font-size:1.15rem; font-weight:700;
    background:#34c759; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25);
    display:flex; align-items:center; gap:8px; max-width:92vw}
  #badge.low{background:#ff5f56}
  #badge.loud{background:#ff9500}
  #badge.off{background:rgba(255,255,255,.22)}
  #badge .em{font-size:1.2em}

  .main-btn{margin-top:18px; border:none; border-radius:999px; padding:15px 40px; font-size:1.12rem;
    font-weight:800; cursor:pointer; color:#4a2b00; letter-spacing:1px;
    background:linear-gradient(135deg,#ffd24a,#f6a623 55%,#ff7a18);
    box-shadow:0 8px 22px rgba(246,166,35,.55); animation:pulseBtn 1.8s ease-in-out infinite}
  @keyframes pulseBtn{0%,100%{transform:scale(1); box-shadow:0 8px 22px rgba(246,166,35,.5)}
    50%{transform:scale(1.06); box-shadow:0 12px 30px rgba(246,166,35,.75)}}
  .main-btn:active{transform:scale(.97); animation:none}
  .main-btn.mic{background:linear-gradient(135deg,#a0e7ff,#4aa8ff 55%,#2f7bff); color:#0a2a55;
    box-shadow:0 8px 22px rgba(74,168,255,.55)}
  #micBtn{display:none}
  #micBtn.show{display:inline-block}
  .btn-hint{margin-top:14px; font-size:.82rem; opacity:.9; letter-spacing:1px;
    background:rgba(255,255,255,.14); padding:6px 16px; border-radius:999px}

  .topbar{position:absolute; top:16px; left:14px; font-size:.92rem; letter-spacing:4px;
    opacity:.85; font-weight:700; display:flex; align-items:center; gap:7px; white-space:nowrap}
  .topbar .dot{width:9px; height:9px; border-radius:50%; background:#f6a623;
    box-shadow:0 0 12px #f6a623; animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .glow{position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,176,48,.55), rgba(255,120,24,.12) 45%, transparent 72%)}

  .particles{position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none}
  .particle{position:absolute; border-radius:50%; will-change:transform,opacity;
    box-shadow:0 0 14px rgba(255,255,255,.3), inset -2px -3px 6px rgba(0,0,0,.2)}

  #panel{position:absolute; inset:0; background:rgba(20,12,40,.55); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  #panel.show{display:flex}
  .pcard{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:18px;
    padding:22px; width:min(90vw,380px); box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .pcard h3{font-size:1.05rem; margin-bottom:14px; letter-spacing:1px}
  .field{margin-bottom:16px}
  .field label{font-size:.85rem; opacity:.9; display:block; margin-bottom:6px}
  .field input[type=range]{width:100%; accent-color:#f6a623}
  .field input[type=number]{width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.15); color:#fff; font-size:1rem; outline:none}
  .valbox{color:#f6a623; font-weight:800}
  .pbtns{display:flex; gap:10px; margin-top:6px}
  .pbtns button{flex:1; border:none; border-radius:12px; padding:12px; font-size:.98rem; font-weight:700;
    cursor:pointer; background:#f6a623; color:#4a2b00}
  .pbtns button.ghost{background:rgba(255,255,255,.18); color:#fff}
  #diag{font-size:.72rem; opacity:.75; margin-top:12px; line-height:1.5; word-break:break-all}

  #gate{position:fixed; inset:0; background:linear-gradient(165deg,#5b3a8e,#8a6cc0);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px}
  #gate.hide{display:none}
  .gate-box{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:20px;
    padding:30px 26px; text-align:center; max-width:360px; box-shadow:0 12px 40px rgba(0,0,0,.35); cursor:default}
  .gate-icon{font-size:3.2rem; animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .gate-title{font-size:1.25rem; font-weight:800; margin:10px 0 6px}
  .gate-sub{font-size:.9rem; opacity:.88; line-height:1.55}
  #gateBtn{margin-top:18px; width:100%; border:none; border-radius:12px; padding:13px;
    font-size:1rem; font-weight:800; cursor:pointer; background:#f6a623; color:#4a2b00}
  .gate-tip{font-size:.76rem; opacity:.85; margin-top:14px; line-height:1.55; text-align:left; word-break:break-all}
  .gate-skip{margin-top:10px; font-size:.78rem; opacity:.8; cursor:pointer; text-decoration:underline}
</style>
</head>
<body>
  <div class="bubble" style="width:120px;height:120px;left:8%;top:12%"></div>
  <div class="bubble" style="width:60px;height:60px;right:14%;top:22%;animation-delay:2s"></div>
  <div class="bubble" style="width:90px;height:90px;left:18%;bottom:18%;animation-delay:4s"></div>
  <div class="bubble" style="width:40px;height:40px;right:20%;bottom:26%;animation-delay:1s"></div>
  <div class="bubble" style="width:26px;height:26px;left:45%;top:8%;animation-delay:3s"></div>
  <div class="bubble" style="width:54px;height:54px;left:62%;top:42%;animation-delay:5s"></div>
  <div class="bubble" style="width:34px;height:34px;right:9%;bottom:9%;animation-delay:6s"></div>
  <div class="bubble" style="width:72px;height:72px;left:32%;top:58%;animation-delay:3.5s"></div>

  <div class="glow"></div>
  <div id="particles" class="particles"></div>
  <main class="stage">
  <div id="timerChip">⏱ <span id="clock">00:00</span></div>
  <div class="topbar"><span class="dot"></span>早读分贝</div>
  <button id="gearBtn" title="设置">⚙️</button>

  <!-- 主界面 -->
  <div class="dbnum"><span id="dbInt">--</span><span class="dbdec">.<span id="d0">0</span><span id="d1">0</span><span id="d2">0</span></span></div>
  <div class="dblabel">分贝（近似值）</div>
  <div id="status" class="warn">未开启麦克风</div>
  <div class="barwrap">
    <div class="bar"><div id="cursor"></div></div>
    <div class="ticks"><span>50</span><span>70</span><span>90</span><span>110</span></div>
  </div>
  <div id="badge" class="off"><span class="em">🎙</span><span id="badgeText">正在检测麦克风…</span></div>
  <button id="micBtn" class="main-btn mic">🎤 开启麦克风</button>
  <button id="timerBtn" class="main-btn">⏱ 设置早读时间</button>
  <div class="btn-hint">👆 点「开启麦克风」测分贝；点「设置早读时间」定时长与达标音量</div>
  </main>

  <!-- 设置抽屉 -->
  <div id="panel">
    <div class="pcard">
      <h3>⚙️ 设置</h3>
      <div class="field">
        <label>达标分贝阈值：<span class="valbox" id="thVal">80</span> dB（低于则提示音量过低）</label>
        <input type="range" id="thRange" min="50" max="110" value="80">
      </div>
      <div class="field">
        <label>早读时长（分钟，计时开始后顶部显示倒计时）</label>
        <input type="number" id="dur" min="1" max="120" value="15">
      </div>
      <div class="pbtns">
        <button id="startTimer">开始计时</button>
        <button id="stopTimer" class="ghost">停止计时</button>
        <button id="closePanel" class="ghost">关闭</button>
      </div>
      <div id="diag"></div>
    </div>
  </div>

  <!-- 授权遮罩（可关闭） -->
  <div id="gate">
    <div class="gate-box">
      <div class="gate-icon">🎤</div>
      <div class="gate-title" id="gateTitle">正在请求麦克风权限…</div>
      <div class="gate-sub" id="gateSub">请点击「允许」以开始早读分贝检测</div>
      <button id="gateBtn">点击开启麦克风</button>
      <div class="gate-tip" id="gateTip"></div>
      <div class="gate-skip" id="gateSkip">暂不开启，先看主界面 →</div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const dbInt=$('dbInt'), d0=$('d0'), d1=$('d1'), d2=$('d2');
  const cursor=$('cursor'), badge=$('badge'), badgeText=$('badgeText'), statusEl=$('status');
  const gate=$('gate'), gateTitle=$('gateTitle'), gateSub=$('gateSub'),
        gateBtn=$('gateBtn'), gateTip=$('gateTip'), gateSkip=$('gateSkip');
  const gearBtn=$('gearBtn'), panel=$('panel'), closePanel=$('closePanel');
  const thRange=$('thRange'), thVal=$('thVal'), dur=$('dur'), diag=$('diag');
  const timerChip=$('timerChip'), clock=$('clock');
  const startTimer=$('startTimer'), stopTimer=$('stopTimer');
  const timerBtn=$('timerBtn'), micBtn=$('micBtn'),
        particlesWrap=$('particles'), glow=$('glow');

  let audioCtx=null, analyser=null, micStream=null, dataArr=null, rafId=null;
  let smoothed=55, micOn=false, threshold=80;
  let timerId=null, timerRemain=0, timerRunning=false;
  const MIN=40, MAX=120;

  // 全屏分散弹跳粒子
  const PARTICLE_N=24;
  const particles=[];
  for(let i=0;i<PARTICLE_N;i++){
    const p=document.createElement('div'); p.className='particle';
    const base=14+Math.random()*30;
    p.style.width=p.style.height=base+'px';
    const left=4+Math.random()*90, top=6+Math.random()*84;
    p.style.left=left+'%'; p.style.top=top+'%';
    const hue=Math.floor(15+Math.random()*115);
    p.style.background='radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), hsl('+hue+',85%,55%) 58%, hsl('+hue+',85%,38%))';
    particlesWrap.appendChild(p);
    particles.push({el:p, phase:Math.random()*Math.PI*2, k:0.6+Math.random()*0.7});
  }

  function setBadgeOff(){
    micBtn.classList.add('show');
    badge.className='off';
    badgeText.textContent='未开启麦克风，点「开启麦克风」测分贝';
    statusEl.className='warn';
    statusEl.textContent='麦克风未开启 · 点「开启麦克风」授权';
  }
  function setStatusOK(v){
    statusEl.className='ok';
    statusEl.textContent='实时测量中 · ' + v + ' dB · 已授权';
  }

  function gatePrompt(){
    gateTitle.textContent='需要麦克风权限';
    gateSub.textContent='点击下方按钮开启；也可点「先看主界面」先浏览';
    gateBtn.textContent='点击开启麦克风';
    gateTip.innerHTML='必须通过 <b>https</b> 或 <b>localhost</b> 打开，否则浏览器会禁用麦克风。';
  }
  function gateFailMsg(msg){
    gateTitle.textContent='麦克风开启失败'; gateSub.textContent='';
    gateBtn.textContent='重试';
    gateTip.innerHTML='❌ '+msg+'<br>若地址栏出现 🎤 图标请选「允许」。';
  }
  function errHint(n){
    switch(n){
      case 'NotAllowedError': return '你拒绝了授权，或浏览器策略拦截。请点地址栏左侧 🎤/🔒 图标选「允许」后重试。';
      case 'NotFoundError': return '未检测到麦克风设备，请检查设备连接。';
      case 'NotReadableError': return '麦克风被其他程序占用（会议/录音软件），请关闭后重试。';
      case 'SecurityError': return '非安全上下文（须 https 或 localhost），麦克风被禁用。';
      case 'TimeoutError': return '请求超时无响应——当前环境无可用麦克风，或浏览器未弹授权框。';
      default: return '错误：'+n+'，请换 Chrome/Edge 重试。';
    }
  }

  // ====== 麦克风（修复：去掉误杀式超时；分析器接零音量输出保证数据处理） ======
  async function initMic(){
    if(micOn) return;
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      gateFailMsg('当前页面地址 <b>'+location.origin+'</b> 不是 https 也不是 localhost，浏览器已禁用麦克风 API。');
      return;
    }
    try{
      gateTitle.textContent='正在请求麦克风权限…'; gateTip.innerHTML='';
      // 直接等待授权，不强行超时（避免用户允许稍慢被误判为失败）
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') await audioCtx.resume();
      const src=audioCtx.createMediaStreamSource(micStream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.5;
      src.connect(analyser);
      // 关键：用零增益接 destination，既让分析器真正处理数据，又不会外放回声
      const sink=audioCtx.createGain(); sink.gain.value=0;
      analyser.connect(sink); sink.connect(audioCtx.destination);
      dataArr=new Float32Array(analyser.fftSize);
      micOn=true;
      gate.classList.add('hide');
      micBtn.classList.remove('show');
      badge.className='';
      statusEl.className='ok';
      statusEl.textContent='麦克风已开启，正在测量…';
    }catch(err){
      const name=err.name||err.message;
      const hint=errHint(name);
      micOn=false;
      if(name==='NotAllowedError'||name==='SecurityError'){ gatePrompt(); }
      else { gateFailMsg(hint); }
    }
  }

  function computeDB(){
    if(!analyser || !dataArr) return 0;
    let sum=0;
    try{
      analyser.getFloatTimeDomainData(dataArr);
      for(let i=0;i<dataArr.length;i++){ const v=dataArr[i]; sum+=v*v; }
    }catch(e){ return 0; }
    const rms=Math.sqrt(sum/dataArr.length);
    let db=20*Math.log10(rms+1e-7)+100;
    if(!isFinite(db)||db<0) db=0; if(db>MAX) db=MAX;
    return db;
  }

  function loop(){
    const now=performance.now()/1000;
    if(micOn){
      const db=computeDB();
      smoothed = db>smoothed ? smoothed*0.4+db*0.6 : smoothed*0.8+db*0.2;
      const v=smoothed;
      const intPart=Math.floor(v), dec=Math.round((v-intPart)*1000), ds=String(dec).padStart(3,'0');
      dbInt.textContent=intPart;
      d0.textContent=ds[0]; d1.textContent=ds[1]; d2.textContent=ds[2];
      const pct=Math.max(0,Math.min(100,(v-MIN)/(MAX-MIN)*100));
      cursor.style.left=pct+'%';
      if(v>105){ badge.className='loud'; badgeText.textContent='⚠️ 音量过大，注意保护嗓子 ('+intPart+' dB)'; }
      else if(v>=threshold){ badge.className=''; badgeText.textContent='✅ 音量达标！继续保持 ('+intPart+' dB)'; }
      else { badge.className='low'; badgeText.textContent='🔊 音量过低！早读要大声，低于阈值 '+threshold+' dB'; }
      setStatusOK(intPart);
    }
    const norm=Math.max(0,Math.min(1,(smoothed-MIN)/(110-MIN)));
    const amp=46+norm*200;
    const freq=1.3+norm*2.4;
    for(let i=0;i<particles.length;i++){
      const pt=particles[i];
      const w=0.5+0.5*Math.sin(now*freq + pt.phase);
      const up=w*amp*pt.k;
      const sc=0.6+0.7*norm+0.18*w;
      pt.el.style.transform='translateY('+(-up)+'px) scale('+sc.toFixed(3)+')';
      pt.el.style.opacity=(0.45+0.5*norm).toFixed(3);
    }
    glow.style.opacity=(0.05+norm*0.5).toFixed(3);
    rafId=requestAnimationFrame(loop);
  }

  function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function startCountdown(){
    if(timerRunning) return;
    const mins=Math.min(120,Math.max(1,parseInt(dur.value,10)||15));
    timerRemain=mins*60; timerRunning=true;
    timerChip.classList.add('show'); clock.textContent=fmt(timerRemain);
    startTimer.textContent='计时中…'; startTimer.disabled=true;
    timerId=setInterval(()=>{
      timerRemain--; clock.textContent=fmt(Math.max(0,timerRemain));
      if(timerRemain<=0){
        clearInterval(timerId); timerRunning=false;
        timerChip.classList.remove('show'); startTimer.disabled=false; startTimer.textContent='开始计时';
        beep();
      }
    },1000);
  }
  function stopCountdown(){
    clearInterval(timerId); timerRunning=false; timerId=null;
    timerChip.classList.remove('show'); startTimer.disabled=false; startTimer.textContent='开始计时';
  }
  function beep(){
    try{
      const c=new (window.AudioContext||window.webkitAudioContext)();
      const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value=880; g.gain.value=.2; o.start();
      setTimeout(()=>{o.stop();c.close();},600);
    }catch(e){}
  }

  thRange.addEventListener('input',()=>{ threshold=parseInt(thRange.value,10); thVal.textContent=threshold; });
  gearBtn.addEventListener('click',()=>panel.classList.add('show'));
  timerBtn.addEventListener('click',()=>panel.classList.add('show'));
  micBtn.addEventListener('click',initMic);
  closePanel.addEventListener('click',()=>panel.classList.remove('show'));
  panel.addEventListener('click',e=>{ if(e.target===panel) panel.classList.remove('show'); });
  startTimer.addEventListener('click',startCountdown);
  stopTimer.addEventListener('click',stopCountdown);
  gateBtn.addEventListener('click',initMic);
  gate.addEventListener('click',e=>{ if(e.target===gate){ gate.classList.add('hide'); setBadgeOff(); } });
  gateSkip.addEventListener('click',()=>{ gate.classList.add('hide'); setBadgeOff(); });

  let bound=false;
  function bindGesture(){
    if(bound) return; bound=true;
    ['click','touchstart','keydown'].forEach(ev=>
      document.addEventListener(ev,()=>{ if(!micOn) initMic(); },{once:true}));
  }

  window.addEventListener('load',()=>{
    loop();
    initMic();
    bindGesture();
    setTimeout(()=>{ if(!micOn) setBadgeOff(); }, 600);
  });
})();
</script>
</body>
</html>
